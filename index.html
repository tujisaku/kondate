<style>
/* Layout: one-hand phone app. Fixed header, scrolling sheet, thumb-zone bottom nav. Large targets for a non-technical user. */
:root{
  --bg:#f7f3ec; --sheet:#fffdf9; --ink:#2f2a25; --muted:#7b7166; --line:#e7dfd3;
  --terra:#c0603f; --terra-soft:#f6e3da; --sage:#6f8a6a; --sage-soft:#e3ebdf;
  --mustard:#c99a2e; --done:#efebe4; --code:#efe9df;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --r:16px;
  --navh:calc(60px + max(6px, env(safe-area-inset-bottom, 0px)));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1d1b18; --sheet:#262320; --ink:#efe8de; --muted:#a89d90; --line:#3a3530;
  --terra:#e08a68; --terra-soft:#3f2b23; --sage:#9bb894; --sage-soft:#2a3328;
  --mustard:#e0b858; --done:#2c2925; --code:#312d28; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.app{max-width:28rem;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;padding-top:env(safe-area-inset-top,0px)}
@supports (height:100dvh){.app{height:100dvh}}
header{padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.02em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.75rem;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:.75rem;padding:6px 10px;border:none;border-radius:999px;background:var(--sage-soft);color:var(--sage);white-space:nowrap;font-weight:700}
.sync.local{background:var(--terra-soft);color:var(--terra)}
.iconbtn{width:44px;height:44px;border:none;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--line)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--sheet);padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{border:none;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted);position:relative;min-height:60px}
nav button[aria-current="page"]{color:var(--terra);font-weight:700}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--terra);color:#fff;font-size:.7rem;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
body:not([data-screen="app"]) nav,body:not([data-screen="app"]) #overlay,body[data-screen="loading"] header .sync,body:not([data-screen="app"]) #gear{display:none}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:4px 0 4px;text-wrap:balance}
.lead{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:2px dashed var(--line);border-radius:var(--r);font-size:.92rem}
/* chat */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.ava{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.85rem;background:var(--sage);color:#fff}
.msg.me .ava{background:var(--terra)}
.bubble{min-width:0;display:flex;flex-direction:column;gap:3px}
.msg.me .bubble{align-items:flex-end}
.who{font-size:.72rem;color:var(--muted)}
.card{border:2px solid var(--line);background:var(--sheet);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;transition:border-color .2s,background .2s}
.msg.me .card{border-bottom-right-radius:6px}.msg:not(.me) .card{border-bottom-left-radius:6px}
.card.sel{border-color:var(--terra);background:var(--terra-soft)}
.card .dish{font-family:var(--f-display);font-weight:700;font-size:1.08rem;word-break:break-word}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;background:var(--sheet);padding:0}
.box svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.sel .box,.on .box{background:var(--terra);border-color:var(--terra)}
.sel .box svg,.on .box svg{opacity:1}
.chip{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:700;white-space:nowrap}
.chip.terra{background:var(--terra-soft);color:var(--terra)}
.note{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.92rem;white-space:pre-wrap}
.composer{position:absolute;left:0;right:0;bottom:var(--navh);padding:10px max(12px,env(safe-area-inset-left,0px)) 10px max(12px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;flex-direction:column;gap:8px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:.88rem;min-height:38px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input[type=text],input[type=password],textarea{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:50px;width:100%}
.row input[type=text],.row input[type=password]{width:auto}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px}
input:focus,textarea:focus{border-color:var(--terra);outline:none}
.btn{border:none;border-radius:14px;padding:12px 18px;min-height:50px;font-weight:700;background:var(--terra);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--sheet);color:var(--ink);border:2px solid var(--line)}
.btn.sage{background:var(--sage);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}
.fab{position:absolute;left:12px;right:12px;bottom:calc(var(--navh) + 10px);box-shadow:0 8px 24px rgba(80,40,20,.25);font-size:1.02rem;min-height:58px;border-radius:18px}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;flex:none}
.spin.dark{border-color:var(--line);border-top-color:var(--terra)}
@keyframes sp{to{transform:rotate(360deg)}}
/* shopping */
.progress{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.progress .nums{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.progress b{font-family:var(--f-display);font-size:1.5rem}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sage);transition:width .3s}
details.boughtArea{margin-top:16px}
details.boughtArea summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 0;list-style:none}
details.boughtArea summary::-webkit-details-marker{display:none}
.addform{display:flex;gap:8px;margin:14px 0}
.addform input{flex:1;min-width:0}.addform .btn,.row .btn{white-space:nowrap;flex:none}
.confirm{background:var(--terra-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
/* history */
.hcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.hcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hcard .dish{font-family:var(--f-display);font-weight:700;font-size:1.12rem}
.meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.stack{display:flex;flex-direction:column;gap:12px}
.hbtn{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-weight:700;font-size:.9rem;min-height:44px;color:var(--terra)}
/* week */
.weekbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);border:none;background:none;padding:6px 0;min-height:44px;text-align:left}
.sw{width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--sage)}
.toggle[aria-pressed="true"] .sw::after{left:19px}
.day{display:flex;align-items:center;gap:10px;background:var(--sheet);border:2px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 8px}
.day.off{opacity:.5}
.day .dw{font-family:var(--f-display);font-weight:700;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage);flex:none}
.day .dw.sat{background:#e3e8f2;color:#4f6b9a}.day .dw.sun{background:var(--terra-soft);color:var(--terra)}
.day .name{flex:1;min-width:0;font-weight:700;font-size:1.02rem;word-break:break-word}
.day .name small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.day .ck{border:none;background:none;padding:4px;flex:none}
.day .mini{width:40px;height:40px;border:none;background:none;border-radius:10px;color:var(--muted);display:grid;place-items:center;flex:none}
.day .mini.locked{color:var(--mustard);background:color-mix(in srgb,var(--mustard) 15%,transparent)}
.day .mini:disabled{opacity:.35}
.day.shake{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}60%{transform:scale(1.02)}100%{transform:none;opacity:1}}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
/* setup */
.steps{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.step{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px}
.stepno{flex:none;width:30px;height:30px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem}
.step .body{min-width:0;display:flex;flex-direction:column;gap:8px;flex:1}
.step b{font-family:var(--f-display);font-size:1.02rem}
.step p{margin:0;font-size:.9rem}
.step a{color:var(--terra);font-weight:700}
.step ul{margin:0;padding-left:1.2em;font-size:.88rem}
pre.code{margin:0;background:var(--code);border-radius:12px;padding:10px 12px;font-size:.78rem;line-height:1.5;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;white-space:pre}
.msgline{font-size:.9rem;min-height:1.4em}
.msgline.err{color:var(--terra);font-weight:700}
.msgline.ok{color:var(--sage);font-weight:700}
details.fold{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
details.fold summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 0}
/* modal */
.modalwrap{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--sheet);color:var(--ink);width:100%;max-width:28rem;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto}
.modal h3{font-family:var(--f-display);margin:0;font-size:1.15rem}
.set{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:8px}
.set b{display:block;margin-bottom:2px}
.set .muted{color:var(--muted)}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;max-width:min(92vw,26rem);bottom:calc(var(--navh) + 80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:30;max-width:90%;text-align:center;display:flex;align-items:center;gap:12px}
.toast button{border:none;background:none;color:var(--terra-soft);font-weight:700;text-decoration:underline;padding:4px 2px;white-space:nowrap;font-size:.9rem}
.tripdishes{margin-top:8px;font-size:.8rem;color:var(--ink);line-height:1.5;word-break:break-word}
.tripdishes span{display:block;font-size:.7rem;color:var(--muted);font-weight:700}
.fixbox{margin-top:16px;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.fixbox .muted{font-size:.78rem;color:var(--muted)}
.fixbox details.boughtArea{margin-top:4px}
.fixbox details .tiles{padding-bottom:6px}
.tile.restore{padding:0;font:inherit;color:inherit;cursor:pointer;border-style:dashed}
.tile.restore .tb{padding-right:10px}
.tile .rv{color:var(--sage);font-weight:700}
.plan{margin-bottom:24px}
.pcard{background:var(--sheet);border:2px solid var(--sage-soft);border-radius:var(--r);padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px}
.pcard .pw{flex:1;min-width:0;display:flex;flex-direction:column}
.pcard .dish{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.pcard .pi{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmade{min-height:44px;padding:8px 14px;font-size:.9rem;flex:none;gap:4px}
.pmade svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none}
.editbtn{border:none;background:none;color:var(--terra);font-size:.78rem;font-weight:700;padding:2px 4px;min-height:28px}
.hcard.editing{border:2px solid var(--terra)}
.echip{display:inline-flex;align-items:center;gap:2px;padding-right:2px}
.echip button{border:none;background:none;color:var(--sage);font-weight:700;padding:0 6px;min-height:26px;font-size:.85rem}
.addwrap{margin:14px 0}
.addwrap .addform{margin:0}
.tgts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tgts span{font-size:.75rem;color:var(--muted);font-weight:700;margin-right:2px}
.tgt{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:.82rem;min-height:36px}
.tgt.on{border-color:var(--terra);background:var(--terra-soft);color:var(--terra);font-weight:700}
.day{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;transition:transform .15s ease}
.day.lifted{z-index:5;transition:none;border-color:var(--terra);box-shadow:0 10px 24px rgba(80,40,20,.22)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper span{width:4em}
.stepper .btn{min-height:42px;width:46px;padding:0;font-size:1.2rem}
.stepper b{min-width:3em;text-align:center;font-variant-numeric:tabular-nums}
.back{align-self:flex-start}
.rcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.rcard b{font-family:var(--f-display)}
.ring{list-style:none;margin:6px 0 0;padding:0}
.ring li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ring li:last-child{border-bottom:none}
.ring li span:last-child{color:var(--muted);white-space:nowrap}
.rsteps{margin:6px 0 0;padding-left:1.4em}
.rsteps li{padding:5px 0 5px 4px;line-height:1.7}
.rcard.tips p{margin:4px 0 0;font-size:.92rem}
.rnote{font-size:.75rem;color:var(--muted);margin:4px 2px 0}
/* swipe to delete */
.swipe{position:relative;overflow:hidden;border-radius:var(--r)}
.swipe-del{position:absolute;top:0;bottom:0;right:0;width:84px;border:none;background:#c84b3a;color:#fff;border-radius:var(--r);font-weight:700;font-size:.82rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.swipe-del svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.swipe-fg{position:relative;background:var(--bg);display:flex;flex-direction:column;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .22s ease}
.swipe.open .swipe-fg{transform:translateX(-92px)}
.hint{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin:0 0 12px}
.linkbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;color:var(--terra);min-height:36px;white-space:nowrap}
/* composer textarea */
.composer .row{align-items:flex-end}
.composer textarea{flex:1;min-width:0;width:auto;min-height:50px;max-height:132px;height:50px;resize:none;font-family:var(--f-body);font-size:16px;line-height:1.4;padding:12px 14px;overflow-y:auto}
textarea.plain{font-family:var(--f-body);font-size:16px;min-height:0;line-height:1.5}
/* shopping tiles */
.aisle{margin-bottom:12px}
.ah{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);margin:0 2px 6px}
.ah::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--sage)}
.ah span{font-weight:400}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{display:inline-flex;align-items:stretch;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;max-width:100%;min-width:0}
.tile .tb{border:none;background:none;display:flex;align-items:center;gap:7px;padding:5px 2px 5px 9px;text-align:left;min-height:42px;min-width:0}
.tile .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.tile .dot svg{width:12px;height:12px;stroke:#fff;stroke-width:3.5;fill:none;opacity:0}
.tile .tw{display:flex;flex-direction:column;min-width:0}
.tile .tn{font-weight:700;font-size:.95rem;line-height:1.25;word-break:break-word}
.tile .tt{font-size:.66rem;line-height:1.3;color:var(--terra);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:10em}
.tile .tx{border:none;background:none;color:var(--muted);width:30px;flex:none;font-size:1rem;padding:0;border-radius:0 12px 12px 0}
.tile.bought{opacity:.5;background:var(--done);border-color:transparent}
.tile.bought .tn{text-decoration:line-through;font-weight:400}
.tile.bought .dot{background:var(--muted);border-color:var(--muted)}
.tile.bought .dot svg{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    const j=await res.json();
    const parts=(j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    return parts.map(p=>p.text||"").join("");

async function callGemini(prompt,key,ms){
  const order=[modelName,...[MODEL_DEFAULT,...MODEL_FALLBACKS].filter(m=>m!==modelName)];
  let lastErr;
  for(const m of order){
    try{
      const k=key||geminiKey, cfg=noThink[m]?null:thinkCfg(m);
      let txt;
      try{ txt=await geminiOnce(m,prompt,k,cfg,ms); }
      catch(e){
        if(!(cfg&&e&&e.status===400)) throw e;
        txt=await geminiOnce(m,prompt,k,null,ms);   // still 400 → bad key, thrown below as usual
        noThink[m]=true; ls.set("kondate.nothink",noThink);
      }
      if(m!==modelName){modelName=m;ls.set("kondate.model",m);}
      return txt;
    }catch(e){lastErr=e; if(e&&e.status===404) continue; throw e;}
  }
  throw lastErr;
}
// Accepts [{"name","aisle"}] (current prompt) or ["name"] (older style). Returns [{name,aisle}] or null.
function parseItems(txt){
  const m=String(txt||"").replace(/```(?:json)?/g,"").match(/\[[\s\S]*\]/);
  if(!m) return null;
  let a; try{a=JSON.parse(m[0]);}catch(e){return null;}
  if(!Array.isArray(a)) return null;
  const out=[];
  for(const x of a){
    if(typeof x==="string"&&x.trim()) out.push({name:x.trim(),aisle:""});
    else if(x&&typeof x==="object"&&typeof x.name==="string"&&x.name.trim()) out.push({name:x.name.trim(),aisle:typeof x.aisle==="string"?x.aisle.trim():""});
  }
  return out.length?out:null;
}

// Ask Gemini (in the background) for the aisle of any unchecked item whose aisle isn't one of the current aisle names.
async function classifyMissing(){
  if(!aiReady()||classifying) return;
  const todo=S.shop.filter(x=>!x.checked&&!validAisle(x.aisle)&&!validAisle(S.aisleMap[norm(x.name)]));
  if(!todo.length) return;
  classifying=true;
  try{

function aiErrText(e){

  if(e&&e.status===404) return "モデルが見つかりませんでした（404）。時間をおいてもう一度お試しください。";

// ================= decomposition =================
function dictLookup(name){
  const n=norm(name);
  if(DICT[n]) return DICT[n];
  const keys=Object.keys(DICT).sort((a,b)=>b.length-a.length);
  for(const k of keys){ if(n.includes(k)) return DICT[k]; }
  for(const k of keys){ if(k.includes(n)&&n.length>=2) return DICT[k]; }
  return null;
}
async function decompose(name){
  const key=norm(name);
  const fromHist=histFor(name);
  if(fromHist) return {ings:fromHist.ings,src:"history"};
  if(S.cache[key]) return {ings:S.cache[key],src:"cache"};
  if(aiReady()){
    try{
      const arr=parseItems(await callGemini(promptDecompose(name)));
      if(arr&&arr.length){
        const seen=new Set(), ings=[], aisles={};
        for(const it of arr){ if(seen.has(it.name)) continue; seen.add(it.name); ings.push(it.name); if(it.aisle){aisles[it.name]=it.aisle;S.aisleMap[norm(it.name)]=it.aisle;} }
        ings.splice(12);
        S.cache[key]=ings;
        store.set("cache",hid(key),{name:key,ings,aisles,at:Date.now()}).catch(()=>{});
        return {ings,aisles,src:"ai"};
      }
      aiFails++;
    }catch(e){aiFails++;console.warn("Gemini:",e);}
  }
  const d=dictLookup(name);
  if(d) return {ings:d,src:"dict"};
  return {ings:GENERIC,src:"generic"};
}
const uniq=a=>[...new Set(a.filter(Boolean))];
async function addDishesToShop(dishes){
  const merged={}; const generic=[]; const resolved={};
  for(const d of dishes){
    const r=d.ings&&d.ings.length?{ings:d.ings,src:"given"}:await decompose(d.name);
    resolved[d.name]=r.ings;
    if(r.src==="generic") generic.push(d.name);
    for(const ing of r.ings){
      const id=hid(ing);
      const cur=merged[id]||S.shop.find(x=>x.id===id)||{name:ing,tags:[],checked:false,aisle:""};
      const aisle=(r.aisles&&r.aisles[ing])||cur.aisle||S.aisleMap[norm(ing)]||"";
      merged[id]={name:cur.name,tags:[...new Set([...(cur.tags||[]),d.name])],checked:false,aisle};
    }
  }
  for(const [id,v] of Object.entries(merged)){ await store.set("shop",id,v).catch(()=>{}); if(S.trash.some(t=>t.id===id)) store.del("trash",id).catch(()=>{}); }
  const now=Date.now();
  await Promise.all(dishes.map((d,i)=>{const c=S.cart.find(x=>norm(x.name)===norm(d.name));
    return store.set("cart",hid(d.name),{name:d.name,at:c?c.at:now+i,ings:uniq([...((c&&c.ings)||[]),...(d.ings||resolved[d.name]||[])]),added:(c&&c.added)||[]}).catch(()=>{});}));
  classifyMissing();
  return generic;
}

// Row markup: .swipe[data-swipe="col:id"] > button.swipe-del + .swipe-fg. Handlers are delegated on #main (bound once).
let openSwipe=null, swipeDrag=null, eatClick=false;
const SW_W=92;
function swipeWrap(key,inner){
  return '<div class="swipe'+(openSwipe===key?' open':'')+'" data-swipe="'+esc(key)+'"><button class="swipe-del" data-swdel="'+esc(key)+'" type="button" aria-label="削除">'+TRASH+'削除</button><div class="swipe-fg">'+inner+'</div></div>';

function closeSwipes(){openSwipe=null;document.querySelectorAll(".swipe.open").forEach(x=>x.classList.remove("open"));}
(function bindSwipe(){
  const main=$("#main");
  main.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0) return;
    const fg=e.target.closest(".swipe-fg"); if(!fg){swipeDrag=null;return;}
    const row=fg.parentElement;
    swipeDrag={fg,row,key:row.dataset.swipe,x:e.clientX,y:e.clientY,base:row.classList.contains("open")?-SW_W:0,t:0,active:false,id:e.pointerId};
  });
  main.addEventListener("pointermove",e=>{
    const d=swipeDrag; if(!d||e.pointerId!==d.id) return;
    const dx=e.clientX-d.x, dy=e.clientY-d.y;
    if(!d.active){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){d.active=true;d.fg.style.transition="none";try{d.fg.setPointerCapture(e.pointerId);}catch(err){}}
      else if(Math.abs(dy)>10){swipeDrag=null;return;}
      else return;
    }
    d.t=Math.min(0,Math.max(-SW_W*1.5,d.base+dx));
    d.fg.style.transform="translateX("+d.t+"px)";
  });
  const end=e=>{
    const d=swipeDrag; if(!d||e.pointerId!==d.id) return; swipeDrag=null;
    if(!d.active) return;
    d.fg.style.transition=""; d.fg.style.transform="";
    const open=d.t<-SW_W/2;
    closeSwipes();
    if(open){openSwipe=d.key;d.row.classList.add("open");}
    eatClick=true; setTimeout(()=>{eatClick=false;},120);
  };
  main.addEventListener("pointerup",end);
  main.addEventListener("pointercancel",e=>{const d=swipeDrag;if(d&&d.active){d.fg.style.transition="";d.fg.style.transform="";}swipeDrag=null;});
  // Capture phase: swallow the click that ends a drag, and let a tap anywhere else just close an open row.
  main.addEventListener("click",e=>{
    if(eatClick){eatClick=false;e.stopPropagation();e.preventDefault();return;}
    const del=e.target.closest("[data-swdel]");
    if(del){e.stopPropagation();e.preventDefault();const [col,...rest]=del.dataset.swdel.split(":");const id=rest.join(":");const row=(S[col]||[]).find(r=>r.id===id);openSwipe=null;if(row)removeDocs(col,[row],col==="history"?"「"+row.name+"」を履歴から消しました":col==="plan"?"「"+row.name+"」を予定から外しました":"チャットから消しました");return;}
    if(openSwipe){e.stopPropagation();e.preventDefault();closeSwipes();}
  },true);
})();

// S.cart = dishes on the current shopping trip (shown on the progress tile).
// S.trash = ingredients removed with × (kept until the trip is completed, so they can be put back).
function tripDishes(){
  const names=[]; const add=n=>{if(n&&n!=="手で追加"&&!names.some(x=>norm(x)===norm(n)))names.push(n);};
  [...S.cart].sort((a,b)=>a.at-b.at).forEach(c=>add(c.name));
  S.shop.forEach(x=>(x.tags||[]).forEach(add));
  return names;
}

// Shopping done → each dish goes to "今週の予定" (plan). It reaches 履歴 only when someone taps 作った.
async function completeShopping(){
  const items=[...S.shop]; const dishes={};
  for(const n of tripDishes()) dishes[n]=[];
  for(const it of items) for(const t of (it.tags||[])) if(t!=="手で追加"&&dishes[t]) dishes[t].push(it.name);
  const now=Date.now(); let i=0;
  for(const [name,got] of Object.entries(dishes)){
    const h=histFor(name), c=S.cart.find(x=>norm(x.name)===norm(name));
    // The dish's own list (saved when it was added) wins: ✓ and × only mean "buy this time or not".
    const ings=(c&&c.ings&&c.ings.length)?c.ings:(h&&h.ings)||got;
    const m=[...S.menus].filter(x=>x.type==="dish"&&norm(x.name)===norm(name)).sort((a,b)=>b.at-a.at)[0];
    await store.set("plan",hid(name),{name,ings,added:(c&&c.added)||[],by:m?m.by:myName,at:now+(i++)}).catch(()=>{});
    for(const mm of S.menus.filter(x=>x.type==="dish"&&!x.done&&norm(x.name)===norm(name))){
      await store.set("menus",mm.id,{type:"dish",name:mm.name,by:mm.by||"",at:mm.at,done:true}).catch(()=>{});
    }
  }
  await Promise.all([...items.map(it=>store.del("shop",it.id)),...S.cart.map(c=>store.del("cart",c.id)),...S.trash.map(t=>store.del("trash",t.id))].map(p=>p.catch(()=>{})));
  confirmDone=false; setTab("hist"); toast("おつかれさまでした！「今週の予定」に入れました");
}

// ================= plan (今週の予定) & history =================
const histSame=name=>S.history.filter(h=>norm(h.name)===norm(name));
// The ingredient list to reuse for a dish: a hand-edited list wins (newest edit first); otherwise the newest entry.
function histFor(name){
  return histSame(name).filter(h=>Array.isArray(h.ings)&&h.ings.length).sort((a,b)=>(b.editedAt?1:0)-(a.editedAt?1:0)||(b.editedAt||b.at||0)-(a.editedAt||a.at||0))[0]||null;
}
const strip=r=>{const {id,...d}=r;return d;};
async function madeIt(p){
  const now=Date.now(); const prev=histFor(p.name)||histSame(p.name)[0]; let newId=null;
  if(prev){
    const d=strip(prev); delete d.sample;
    const base=(prev.ings&&prev.ings.length)?prev.ings:(p.ings||[]);
    const ings=uniq([...base,...(p.added||[])]);
    if(ings.length>base.length) d.editedAt=now;   // ingredients added for this dish on the shopping page become part of it
    await store.set("history",prev.id,{...d,at:now,by:p.by||d.by||myName,ings}).catch(()=>{});
  }
  else { newId=uid(); await store.set("history",newId,{name:p.name,by:p.by||myName,at:now,ings:p.ings||[]}).catch(()=>{}); }
  await store.del("plan",p.id).catch(()=>{});
  return ()=>{store.set("plan",p.id,strip(p)).catch(()=>{}); if(prev) store.set("history",prev.id,strip(prev)).catch(()=>{}); else store.del("history",newId).catch(()=>{});};
}
function dupGroups(){const g={};S.history.forEach(x=>{(g[norm(x.name)]=g[norm(x.name)]||[]).push(x);});return Object.values(g).filter(a=>a.length>1);}
// Keep the newest row of each same-named dish, with the most recently edited ingredient list; delete the rest.
async function mergeDups(){
  const groups=dupGroups(); if(!groups.length) return;
  const orig=groups.flat().map(r=>({...r})); let removed=0;
  const plan=groups.map(g=>{
    const sorted=[...g].sort((a,b)=>b.at-a.at), keep=sorted[0], src=histFor(keep.name)||keep;
    const doc=strip(keep); doc.ings=src.ings||keep.ings||[]; if(g.some(x=>!x.sample)) delete doc.sample;
    return {keep,doc,drop:sorted.slice(1)};
  });
  const gone=new Set(plan.flatMap(x=>x.drop.map(d=>d.id)));
  S.history=S.history.filter(h=>!gone.has(h.id)).map(h=>{const x=plan.find(q=>q.keep.id===h.id);return x?{id:h.id,...x.doc}:h;});
  removed=gone.size; render();
  toast("重なっていた"+removed+"件をまとめました",()=>orig.forEach(r=>store.set("history",r.id,strip(r)).catch(()=>{})));
  for(const x of plan){
    await store.set("history",x.keep.id,x.doc).catch(()=>{});
    for(const d of x.drop) await store.del("history",d.id).catch(()=>{});
  }
}

  return "次の料理の、家庭で作りやすいレシピを作ってください。料理名: "+r.name+"。人数: "+servText()+(h.kids?"（子どもは大人の半量くらいで計算）":"")+"。"+
  ((r.ings||[]).length?"材料はなるべく次の食材を使い、足りない調味料などは足してください: "+r.ings.join("、")+"。":"")+
  "分量はグラム・個・大さじなど具体的に書いてください。出力はJSONオブジェクトのみで、形式は {\"time\":\"約30分\",\"ingredients\":[{\"name\":\"豚肉\",\"amount\":\"200g\"}],\"steps\":[\"手順1\",\"手順2\"],\"tips\":\"コツをひとこと\"} です。余計な解説は不要です。";};
function parseRecipe(txt){
  const m=String(txt||"").replace(/```(?:json)?/g,"").match(/\{[\s\S]*\}/); if(!m) return null;
  let o; try{o=JSON.parse(m[0]);}catch(e){return null;}
  if(!o||!Array.isArray(o.ingredients)||!Array.isArray(o.steps)||!o.steps.length) return null;
  return {time:String(o.time||""),tips:String(o.tips||""),
    ingredients:o.ingredients.map(x=>typeof x==="string"?{name:x,amount:""}:{name:String(x&&x.name||""),amount:String(x&&x.amount||"")}).filter(x=>x.name),
    steps:o.steps.map(x=>String(x)).filter(Boolean)};
}
async function openRecipe(r,force){
  recipeView={name:r.name,ings:r.ings||[]}; const key=recipeKey(recipeView);
  recipeState={status:"loading",key}; render(); $("#main").scrollTop=0;
  try{
    if(!force){ const got=await store.get("recipes",key); if(recipeState.key!==key) return;
      if(got&&got.recipe){recipeState={status:"ok",key,data:got.recipe};render();return;} }
    if(!aiReady()){recipeState={status:"nokey",key};render();return;}
    const data=parseRecipe(await callGemini(promptRecipe(recipeView),null,45000));
    if(recipeState.key!==key) return;
    if(!data){recipeState={status:"err",key,msg:"レシピの形がうまく読み取れませんでした。"};render();return;}

const DOW=["月","火","水","木","金","土","日"];
let fillDict=ls.get("kondate.fill",true), animDays=new Set();
function pool(){
  const names=[...new Set(S.history.map(h=>h.name))];
  if(fillDict&&names.length<7){for(const k of Object.keys(DICT)) if(k!=="唐揚げ"&&k!=="うどん"&&!names.some(n=>norm(n)===k)) names.push(k);}
  return names;
}
function pick(exclude){const p=pool().filter(n=>!exclude.includes(n));if(!p.length)return null;return p[Math.floor(Math.random()*p.length)];}
function weekDays(){return (S.week&&Array.isArray(S.week.days)&&S.week.days.length===7)?S.week.days.map(d=>({...d})):null;}
async function saveWeek(days){S.week={days};render();await store.set("week","current",{days,at:Date.now()}).catch(()=>{});}
function shuffleAll(){
  const cur=weekDays()||DOW.map(()=>({name:null,locked:false,on:true}));
  const used=cur.filter(d=>d.locked&&d.name).map(d=>d.name);
  const days=cur.map(d=>{if(d.locked&&d.name)return d;const n=pick(used);if(n)used.push(n);return {name:n,locked:false,on:d.on!==false};});
  animDays=new Set(days.map((d,i)=>d.locked?-1:i));saveWeek(days);
}

// Long-press a day, then slide up/down: the dish (name + lock) moves, weekdays and the ✓ stay put.
let wDrag=null, wJustDropped=false;
(function bindWeekDrag(){
  const main=$("#main");
  const start=(e,x,y)=>{
    if(tab!=="week"||screen!=="app") return;
    const row=e.target.closest(".day[data-i]"); if(!row||e.target.closest("button")) return;
    if(wDrag) clearTimeout(wDrag.timer);
    wDrag={row,from:+row.dataset.i,x,y,active:false,timer:setTimeout(lift,380)};
  };
  function lift(){
    const d=wDrag; if(!d||!d.row.isConnected){wDrag=null;return;}
    const days=weekDays(); if(!days||!days[d.from].name){wDrag=null;return;}
    d.active=true; d.rows=[...document.querySelectorAll(".day[data-i]")];
    const rc=d.rows.map(r=>r.getBoundingClientRect()); d.step=rc.length>1?rc[1].top-rc[0].top:rc[0].height+8; d.to=d.from;
    d.row.classList.add("lifted"); try{navigator.vibrate&&navigator.vibrate(12);}catch(err){}
    d.s0=main.scrollTop; d.ly=d.y; autoScroll();
  }
  // While a tile is held near the top/bottom edge of the list, keep scrolling so far-away days can be reached.
  function autoScroll(){
    const d=wDrag; if(!d||!d.active) return;
    const r=main.getBoundingClientRect(), edge=70; let v=0;
    // Only scroll toward the edge the finger has moved to (a tile picked up near the bottom shouldn't start the list moving).
    if(d.ly<r.top+edge&&d.ly<d.y-20) v=-Math.ceil((r.top+edge-d.ly)/8); else if(d.ly>r.bottom-edge&&d.ly>d.y+20) v=Math.ceil((d.ly-(r.bottom-edge))/8);
    if(v){const before=main.scrollTop;main.scrollTop+=v;if(main.scrollTop!==before)place();}
    requestAnimationFrame(autoScroll);
  }
  function place(){
    const d=wDrag; if(!d||!d.active) return;
    const dy=(d.ly-d.y)+(main.scrollTop-d.s0); d.row.style.transform="translateY("+dy+"px) scale(1.02)";
    d.to=Math.max(0,Math.min(d.rows.length-1,d.from+Math.round(dy/d.step)));
    d.rows.forEach((r,i)=>{ if(i===d.from) return; let s=0;
      if(d.from<d.to&&i>d.from&&i<=d.to) s=-d.step; else if(d.from>d.to&&i<d.from&&i>=d.to) s=d.step;
      r.style.transform=s?"translateY("+s+"px)":""; });
  }
  const move=(e,x,y)=>{
    const d=wDrag; if(!d) return;
    if(!d.active){ if(Math.abs(x-d.x)>8||Math.abs(y-d.y)>8){clearTimeout(d.timer);wDrag=null;} return; }
    if(e.cancelable) e.preventDefault();
    d.ly=y; place();
  };
  const end=()=>{
    const d=wDrag; if(!d) return; clearTimeout(d.timer); wDrag=null; if(!d.active) return;
    d.rows.forEach(r=>{r.style.transform="";}); d.row.classList.remove("lifted");
    wJustDropped=true; setTimeout(()=>{wJustDropped=false;},120);
    if(d.to===d.from) return;
    const days=weekDays(); const pay=days.map(x=>({name:x.name,locked:!!x.locked}));
    const [m]=pay.splice(d.from,1); pay.splice(d.to,0,m);
    animDays=new Set(); saveWeek(days.map((x,i)=>({...pay[i],on:x.on!==false})));
  };
  main.addEventListener("touchstart",e=>{const t=e.touches[0];if(e.touches.length===1)start(e,t.clientX,t.clientY);},{passive:true});
  main.addEventListener("touchmove",e=>{const t=e.touches[0];move(e,t.clientX,t.clientY);},{passive:false});
  main.addEventListener("touchend",end); main.addEventListener("touchcancel",end);
  main.addEventListener("mousedown",e=>{if(e.button===0)start(e,e.clientX,e.clientY);});
  window.addEventListener("mousemove",e=>move(e,e.clientX,e.clientY));
  window.addEventListener("mouseup",end);
  main.addEventListener("contextmenu",e=>{if(e.target.closest(".day[data-i]"))e.preventDefault();});
  main.addEventListener("click",e=>{if(wJustDropped&&e.target.closest(".day[data-i]")){e.stopPropagation();e.preventDefault();}},true);
})();

    '<div class="set"><b>お名前</b><div class="row"><input type="text" id="nameChg" maxlength="12" value="'+esc(myName)+'" autocomplete="off"><button class="btn ghost" id="nameSave" type="button">変更</button></div></div>'+
    (mode==="firebase"
      ?'<div class="set"><b>奥様に送る招待リンク</b><span class="muted">このリンクを開くだけで、同じ献立帖につながります。ふたり以外には送らないでください。</span><input type="text" id="invLink" readonly value="'+esc(link)+'"><div class="row"><button class="btn" id="invCopy" type="button" style="flex:1">コピー</button>'+(navigator.share?'<button class="btn sage" id="invShare" type="button" style="flex:1">LINEなどで送る</button>':'')+'</div><span class="muted">奥様のiPhoneでは、リンクをSafariで開いたあと、共有ボタンから「ホーム画面に追加」をするとアプリのように使えます。</span></div>'
      :'<div class="set"><b>共有のようす</b><span class="muted">いまはこの端末の中だけに保存しています。奥様と共有するには準備が必要です。</span><button class="btn block" id="goSetup" type="button">共有の設定をはじめる</button></div>')+
    '<div class="set"><b>Gemini APIキー</b><span class="muted">Google AI Studioで無料で取れるキーです。入れると、辞書にない料理もAIが食材に分けます。キーはこの端末の中だけに保存されます。</span>'+
      '<div><span class="chip '+(geminiKey?'':'terra')+'">'+(geminiKey?'AI分解モード（キー保存済み）':'辞書モード（キー未設定）')+'</span></div>'+
      '<input type="password" id="keyIn" placeholder="AIza… で始まるキーを貼り付け" autocomplete="off" value="'+esc(geminiKey)+'">'+
      '<div class="row"><button class="btn" id="keySave" type="button" style="flex:1">保存</button><button class="btn ghost" id="keyTest" type="button" style="flex:1">接続テスト</button></div>'+
      (geminiKey?'<button class="btn ghost block" id="keyDel" type="button">キーを消して辞書モードに戻す</button>':'')+
      '<div id="keyMsg" class="msgline" role="status"></div><span class="muted" style="font-size:.78rem">使用モデル：'+esc(modelName)+'</span></div>'+
    '<div class="set"><b>レシピの人数</b><span class="muted">「今週の予定」のレシピを、この人数で作ります。この家庭（招待リンクでつながった人）で共通の設定です。</span>'+
      ['adults','kids'].map(k=>'<div class="stepper"><span>'+(k==="adults"?"大人":"子ども")+'</span><button class="btn ghost" data-hh="'+k+':-1" type="button" aria-label="'+(k==="adults"?"大人":"子ども")+'を減らす">−</button><b id="hh_'+k+'">'+S.household[k]+'人</b><button class="btn ghost" data-hh="'+k+':1" type="button" aria-label="'+(k==="adults"?"大人":"子ども")+'を増やす">＋</button></div>').join("")+
      '<span class="muted" style="font-size:.78rem">いまの設定：'+esc(servText())+'（子どもは大人の半量で計算します）</span></div>'+
    '<div class="set"><b>売り場の順番</b><span class="muted">よく行くスーパーを回る順に、売り場を1行にひとつずつ書いてください。買い物リストがこの順に並びます。ふたりで共通の設定です。</span>'+
      '<textarea id="aisleIn" class="plain" rows="8" spellcheck="false">'+esc(aisleDraft)+'</textarea>'+
      '<div class="row"><button class="btn" id="aisleSave" type="button" style="flex:1">順番を保存</button><button class="btn ghost" id="aisleReset" type="button" style="flex:1">はじめの順に戻す</button></div>'+
      '<span class="muted" style="font-size:.78rem">AI分解モードでは、AIがこの売り場名で食材を分けます。辞書モードでは、よくある食材だけを自動で振り分けます。</span></div>'+
    (mode==="firebase"
      ?'<div class="set"><b>この端末の接続</b>'+(confirmLeave?'<span class="muted">この端末の設定を消します。献立のデータは消えません。もう一度つなぐには招待リンクが必要です。</span><div class="row"><button class="btn ghost" id="leaveNo" type="button" style="flex:1">やめる</button><button class="btn" id="leaveYes" type="button" style="flex:1">解除する</button></div>':'<button class="btn ghost block" id="leave" type="button">接続を解除する</button>')+'</div>':'')+
    '<div class="set"><b>辞書に入っている料理（'+Object.keys(DICT).length+'品）</b><span class="muted">'+esc(Object.keys(DICT).join("・"))+'</span></div>'+
    '<button class="btn block" id="closeM" type="button">とじる</button></div>';
    const q=s=>ov.querySelector(s), msg=t=>{const m=q("#keyMsg");if(m)m.textContent=t;};
    q("#closeM").onclick=()=>ov.remove();
    q("#nameSave").onclick=()=>{const v=q("#nameChg").value.trim();if(!v){toast("お名前を入れてください");return;}myName=v;ls.set("kondate.name",v);render();toast("名前を変えました");};
    if(q("#invCopy")){q("#invCopy").onclick=()=>copyText(link,"リンクをコピーしました");q("#invLink").onfocus=e=>e.target.select();}
    if(q("#invShare")) q("#invShare").onclick=()=>{navigator.share({title:"ふたりの献立帖",text:"献立アプリです。開いたら名前を入れてね。",url:link}).catch(()=>{});};
    if(q("#goSetup")) q("#goSetup").onclick=()=>{ov.remove();screen="setup";render();};
    q("#keySave").onclick=()=>{const v=q("#keyIn").value.trim();geminiKey=v;ls.set("kondate.geminiKey",v);draw();render();const m=q("#keyMsg");if(m){m.className="msgline ok";m.textContent=v?"保存しました。「接続テスト」で動くか確かめられます。":"キーが空なので辞書モードです。";}};
    q("#keyTest").onclick=async()=>{
      const v=q("#keyIn").value.trim();
      if(!v){msg("先にキーを入れてください。");return;}
      q("#keyMsg").className="msgline"; msg("Geminiに問い合わせています…");
      try{const arr=parseItems(await callGemini(promptDecompose("カレー"),v));const m=q("#keyMsg");if(arr&&arr.length){m.className="msgline ok";m.textContent="つながりました（"+modelName+"）。カレー → "+arr.map(x=>x.name+(x.aisle?"（"+x.aisle+"）":"")).join("、");}else{m.className="msgline err";m.textContent="つながりましたが、答えの形が想定と違いました。";}}
      catch(e){const m=q("#keyMsg");m.className="msgline err";m.textContent=aiErrText(e);}
    };
    q("#aisleIn").oninput=e=>{aisleDraft=e.target.value;};
    ov.querySelectorAll("[data-hh]").forEach(b=>b.onclick=()=>{
      const [k,dv]=b.dataset.hh.split(":"); const h={...S.household}; h[k]=Math.max(k==="adults"?1:0,Math.min(10,h[k]+(+dv)));
      S.household=h; draw(); render(); store.set("settings","household",{...h,at:Date.now()}).catch(()=>{});
    });
    const saveAisles=async list=>{
      list=[...new Set(list.map(x=>x.trim()).filter(Boolean))].slice(0,30);
      if(!list.length){toast("売り場を1つ以上書いてください");return;}
      S.aisles=list; aisleDraft=list.join("\n"); draw(); render();
      await store.set("settings","aisles",{list,at:Date.now()}).catch(()=>{});
      toast("売り場の順番を保存しました"); classifyMissing();
    };
    q("#aisleSave").onclick=()=>saveAisles(q("#aisleIn").value.split(/\n+/));
    q("#aisleReset").onclick=()=>saveAisles(AISLES_DEFAULT.slice());
    if(q("#keyDel")) q("#keyDel").onclick=()=>{geminiKey="";ls.set("kondate.geminiKey","");draw();render();};
    if(q("#leave")) q("#leave").onclick=()=>{confirmLeave=true;draw();};
    if(q("#leaveNo")) q("#leaveNo").onclick=()=>{confirmLeave=false;draw();};
    if(q("#leaveYes")) q("#leaveYes").onclick=()=>{ls.del("kondate.fb");ls.del("kondate.mode");try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}location.reload();};
  };
  draw(); ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();}); document.body.appendChild(ov);
}
$("#gear").addEventListener("click",openSettings);
$("#syncBadge").addEventListener("click",()=>{if(screen==="app")openSettings();});

// ================= boot =================
function resetData(){S.household={adults:2,kids:0};S.menus=[];S.shop=[];S.history=[];S.plan=[];S.cart=[];S.trash=[];S.cache={};S.week=null;S.aisles=AISLES_DEFAULT.slice();S.aisleMap={};seedTried=false;}
async function seedIfNeeded(){
  try{
    if(await store.get("meta","seeded")) return;
    if(S.history.length){await store.set("meta","seeded",{at:Date.now()});return;}
    const now=Date.now();
    for(let i=0;i<SEEDS.length;i++){
      await store.set("history","s"+String(i+1).padStart(2,"0"),{name:SEEDS[i][0],ings:SEEDS[i][1],at:now-(i+1)*2*86400000,sample:true});
    }
    await store.set("meta","seeded",{at:now});
  }catch(e){console.warn("seed",e);}
}
function subscribeAll(){
  store.listen("menus",rows=>{S.menus=rows;const grew=rows.length>lastMenuCount;lastMenuCount=rows.length;render();if(tab==="chat"&&grew&&screen==="app")scrollChatEnd();});
  store.listen("shop",rows=>{S.shop=rows;render();});
  store.listen("cart",rows=>{S.cart=rows;render();});
  store.listen("trash",rows=>{S.trash=rows;render();});
  store.listen("plan",rows=>{S.plan=rows;render();});
  store.listen("history",(rows,fromCache)=>{S.history=rows;render();if(!fromCache&&!seedTried){seedTried=true;seedIfNeeded();}});
  store.listen("cache",rows=>{for(const r of rows) if(r.name&&Array.isArray(r.ings)){S.cache[r.name]=r.ings;if(r.aisles&&typeof r.aisles==="object")for(const [k,v] of Object.entries(r.aisles))S.aisleMap[norm(k)]=v;}});
  store.listen("settings",rows=>{const hh=rows.find(r=>r.id==="household");S.household=hh&&hh.adults>=1?{adults:+hh.adults,kids:+hh.kids||0}:{adults:2,kids:0};const a=rows.find(r=>r.id==="aisles");S.aisles=a&&Array.isArray(a.list)&&a.list.length?a.list:AISLES_DEFAULT.slice();render();});
  store.listen("week",rows=>{const w=rows.find(r=>r.id==="current");S.week=w||null;render();});
}
function startApp(){
  screen="app";
  if(!started){started=true;subscribeAll();}
  render(); if(tab==="chat") scrollChatEnd();
}
function afterConnect(){
  if(!myName){screen="name";render();return;}
  startApp();
}
function applyHash(){
  const j=readInvite(location.hash||"");
  if(!j) return;
  if(!(fbCfg&&fbCfg.r===j.r&&fbCfg.c&&fbCfg.c.projectId===j.c.projectId)){
    fbCfg=j; ls.set("kondate.fb",j);
  }
  mode="firebase"; ls.set("kondate.mode","firebase");
}
async function boot(){
  applyHash();
  if(mode==="firebase"&&fbCfg){
    screen="loading"; render();
    try{ if(!fb) await connectFirebase(fbCfg.c,fbCfg.r); }
    catch(e){screen="error";errMsg=friendly(e);render();return;}
  }else if(mode==="local"){
    // local mode: nothing to connect
  }else{
    screen="setup"; render(); return;
  }
  afterConnect();
}
boot();
</script>
