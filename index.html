<style>
/* Layout: one-hand phone app. Fixed header, scrolling sheet, thumb-zone bottom nav. Large targets for a non-technical user. */
:root{
  --bg:#f7f3ec; --sheet:#fffdf9; --ink:#2f2a25; --muted:#7b7166; --line:#e7dfd3;
  --terra:#c0603f; --terra-soft:#f6e3da; --sage:#6f8a6a; --sage-soft:#e3ebdf;
  --mustard:#c99a2e; --done:#efebe4; --code:#efe9df;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --r:16px;
  --navh:calc(60px + max(6px, env(safe-area-inset-bottom, 0px)));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1d1b18; --sheet:#262320; --ink:#efe8de; --muted:#a89d90; --line:#3a3530;
  --terra:#e08a68; --terra-soft:#3f2b23; --sage:#9bb894; --sage-soft:#2a3328;
  --mustard:#e0b858; --done:#2c2925; --code:#312d28; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.app{max-width:28rem;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;padding-top:env(safe-area-inset-top,0px)}
@supports (height:100dvh){.app{height:100dvh}}
header{padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.02em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.75rem;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:.75rem;padding:6px 10px;border:none;border-radius:999px;background:var(--sage-soft);color:var(--sage);white-space:nowrap;font-weight:700}
.sync.local{background:var(--terra-soft);color:var(--terra)}
.iconbtn{width:44px;height:44px;border:none;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--line)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--sheet);padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{border:none;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted);position:relative;min-height:60px}
nav button[aria-current="page"]{color:var(--terra);font-weight:700}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--terra);color:#fff;font-size:.7rem;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
body:not([data-screen="app"]) nav,body:not([data-screen="app"]) #overlay,body[data-screen="loading"] header .sync,body:not([data-screen="app"]) #gear{display:none}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:4px 0 4px;text-wrap:balance}
.lead{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:2px dashed var(--line);border-radius:var(--r);font-size:.92rem}
/* chat */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.ava{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.85rem;background:var(--sage);color:#fff}
.msg.me .ava{background:var(--terra)}
.bubble{min-width:0;display:flex;flex-direction:column;gap:3px}
.msg.me .bubble{align-items:flex-end}
.who{font-size:.72rem;color:var(--muted)}
.card{border:2px solid var(--line);background:var(--sheet);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;transition:border-color .2s,background .2s}
.msg.me .card{border-bottom-right-radius:6px}.msg:not(.me) .card{border-bottom-left-radius:6px}
.card.sel{border-color:var(--terra);background:var(--terra-soft)}
.card .dish{font-family:var(--f-display);font-weight:700;font-size:1.08rem;word-break:break-word}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;background:var(--sheet);padding:0}
.box svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.sel .box,.on .box{background:var(--terra);border-color:var(--terra)}
.sel .box svg,.on .box svg{opacity:1}
.chip{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:700;white-space:nowrap}
.chip.terra{background:var(--terra-soft);color:var(--terra)}
.note{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.92rem;white-space:pre-wrap}
.composer{position:absolute;left:0;right:0;bottom:var(--navh);padding:10px max(12px,env(safe-area-inset-left,0px)) 10px max(12px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;flex-direction:column;gap:8px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:.88rem;min-height:38px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input[type=text],input[type=password],textarea{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:50px;width:100%}
.row input[type=text],.row input[type=password]{width:auto}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px}
input:focus,textarea:focus{border-color:var(--terra);outline:none}
.btn{border:none;border-radius:14px;padding:12px 18px;min-height:50px;font-weight:700;background:var(--terra);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--sheet);color:var(--ink);border:2px solid var(--line)}
.btn.sage{background:var(--sage);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}
.fab{position:absolute;left:12px;right:12px;bottom:calc(var(--navh) + 10px);box-shadow:0 8px 24px rgba(80,40,20,.25);font-size:1.02rem;min-height:58px;border-radius:18px}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;flex:none}
.spin.dark{border-color:var(--line);border-top-color:var(--terra)}
@keyframes sp{to{transform:rotate(360deg)}}
/* shopping */
.progress{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.progress .nums{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.progress b{font-family:var(--f-display);font-size:1.5rem}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sage);transition:width .3s}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--sheet);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:58px;width:100%;transition:all .3s}
.item .nm{font-size:1.08rem;font-weight:700}
.item .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.item .txt{flex:1;min-width:0;border:none;background:none;text-align:left;padding:0}
.item.bought{opacity:.45;background:var(--done);border-color:transparent;min-height:46px;padding-block:8px}
.item.bought .nm{text-decoration:line-through;font-weight:400}
.item.bought .box{background:var(--muted);border-color:var(--muted)}
.item.bought .box svg{opacity:1}
.item .x{border:none;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;flex:none;font-size:1.2rem}
details.boughtArea{margin-top:16px}
details.boughtArea summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 0;list-style:none}
details.boughtArea summary::-webkit-details-marker{display:none}
.addform{display:flex;gap:8px;margin:14px 0}
.confirm{background:var(--terra-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
/* history */
.hcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.hcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hcard .dish{font-family:var(--f-display);font-weight:700;font-size:1.12rem}
.meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.stack{display:flex;flex-direction:column;gap:12px}
.hbtn{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-weight:700;font-size:.9rem;min-height:44px;color:var(--terra)}
/* week */
.weekbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);border:none;background:none;padding:6px 0;min-height:44px;text-align:left}
.sw{width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--sage)}
.toggle[aria-pressed="true"] .sw::after{left:19px}
.day{display:flex;align-items:center;gap:10px;background:var(--sheet);border:2px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 8px}
.day.off{opacity:.5}
.day .dw{font-family:var(--f-display);font-weight:700;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage);flex:none}
.day .dw.sat{background:#e3e8f2;color:#4f6b9a}.day .dw.sun{background:var(--terra-soft);color:var(--terra)}
.day .name{flex:1;min-width:0;font-weight:700;font-size:1.02rem;word-break:break-word}
.day .name small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.day .ck{border:none;background:none;padding:4px;flex:none}
.day .mini{width:40px;height:40px;border:none;background:none;border-radius:10px;color:var(--muted);display:grid;place-items:center;flex:none}
.day .mini.locked{color:var(--mustard);background:color-mix(in srgb,var(--mustard) 15%,transparent)}
.day .mini:disabled{opacity:.35}
.day.shake{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}60%{transform:scale(1.02)}100%{transform:none;opacity:1}}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
/* setup */
.steps{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.step{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px}
.stepno{flex:none;width:30px;height:30px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.95rem}
.step .body{min-width:0;display:flex;flex-direction:column;gap:8px;flex:1}
.step b{font-family:var(--f-display);font-size:1.02rem}
.step p{margin:0;font-size:.9rem}
.step a{color:var(--terra);font-weight:700}
.step ul{margin:0;padding-left:1.2em;font-size:.88rem}
pre.code{margin:0;background:var(--code);border-radius:12px;padding:10px 12px;font-size:.78rem;line-height:1.5;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;white-space:pre}
.msgline{font-size:.9rem;min-height:1.4em}
.msgline.err{color:var(--terra);font-weight:700}
.msgline.ok{color:var(--sage);font-weight:700}
details.fold{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
details.fold summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 0}
/* modal */
.modalwrap{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--sheet);color:var(--ink);width:100%;max-width:28rem;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto}
.modal h3{font-family:var(--f-display);margin:0;font-size:1.15rem}
.set{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:8px}
.set b{display:block;margin-bottom:2px}
.set .muted{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  </header>
  <main id="main"></main>
  <div id="overlay"></div>
  <nav id="nav">
    <button data-tab="chat" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>献立チャット</button>

function friendly(e){
  const code=(e&&(e.code||""))+"", msg=(e&&e.message||"")+"";
  if(e&&e.friendly) return e.friendly;
  if(/operation-not-allowed|admin-restricted/.test(code)) return "匿名ログインがオンになっていません。手順2を確認してください。";
  if(/api-key-not-valid|invalid-api-key/.test(code+msg)) return "貼り付けた設定のapiKeyが正しくないようです。手順4をやり直してください。";
  if(/permission-denied/.test(code)) return "データベースのルールが公開されていません。手順3のルールを貼り付けて「公開」を押してください。";
  if(/not-found/.test(code)||/does not exist/.test(msg)) return "Firestoreのデータベースが作られていません。手順3を確認してください。";
  if(/network|unavailable|failed-to-fetch/i.test(code+msg)) return "ネットワークにつながりませんでした。電波を確認してもう一度お試しください。";
  return "つながりませんでした（"+(code||msg||"不明なエラー")+"）。";
}
function handleErr(e){

}
function listenErr(col,e){

}
let errShown=false;
const store = {
  listen(col,cb){
    if(fb){return fb.m.onSnapshot(fb.m.collection(fb.fs,"rooms",fb.room,col),snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()})),snap.metadata.fromCache),e=>listenErr(col,e));}
    (local.subs[col]=local.subs[col]||[]).push(cb); setTimeout(()=>local.emit(col)); return ()=>{};
  },
  async get(col,id){
    if(fb){const s=await fb.m.getDoc(fb.m.doc(fb.fs,"rooms",fb.room,col,id));return s.exists()?s.data():null;}
    return (local.data[col]||{})[id]||null;

  async set(col,id,data){

  async del(col,id){

};
const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({friendly:msg}),ms))]);
async function connectFirebase(cfg,room){
  let appM,authM,fsM;
  try{[appM,authM,fsM]=await Promise.all([import(FB_BASE+"firebase-app.js"),import(FB_BASE+"firebase-auth.js"),import(FB_BASE+"firebase-firestore.js")]);}
  catch(e){throw {friendly:"Firebaseの部品を読み込めませんでした。ネットワークを確認して、もう一度お試しください。"};}
  let app;
  try{app=appM.getApps().length?appM.getApp():appM.initializeApp(cfg);}catch(e){throw {friendly:"貼り付けた設定を読み取れませんでした。手順4をやり直してください。"};}
  const auth=authM.getAuth(app);

    if(auth.authStateReady) await auth.authStateReady();

  }catch(e){throw e&&e.friendly?e:{friendly:friendly(e)};}
  const fs=fsM.getFirestore(app);
  const m={onSnapshot:fsM.onSnapshot,collection:fsM.collection,doc:fsM.doc,getDoc:fsM.getDoc,setDoc:fsM.setDoc,deleteDoc:fsM.deleteDoc};

}

// ================= Gemini (direct fetch, key kept in this device) =================
const GEMINI_BASE="https://generativelanguage.googleapis.com/v1beta/models/";
const MODEL_DEFAULT="gemini-2.5-flash", MODEL_FALLBACKS=["gemini-3-flash-preview","gemini-flash-latest"];
const PROMPT="以下の料理を作るために必要な一般的な食材名のみをJSONの文字列配列（例: [\"豚肉\", \"玉ねぎ\", \"人参\"]）で出力してください。余計な解説は不要です。料理名: ";
let geminiKey=ls.get("kondate.geminiKey",""), modelName=ls.get("kondate.model",MODEL_DEFAULT), aiFails=0;
const aiReady=()=>!!geminiKey;
async function geminiOnce(model,prompt,key){
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),20000);
  try{
    const res=await fetch(GEMINI_BASE+model+":generateContent",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json"}}),
      signal:ctrl.signal
    });
    if(!res.ok){const err=new Error("HTTP "+res.status);err.status=res.status;throw err;}
    const j=await res.json();
    const parts=(j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    return parts.map(p=>p.text||"").join("");
  } finally { clearTimeout(timer); }
}
async function callGemini(prompt,key){
  const order=[modelName,...[MODEL_DEFAULT,...MODEL_FALLBACKS].filter(m=>m!==modelName)];
  let lastErr;
  for(const m of order){
    try{
      const txt=await geminiOnce(m,prompt,key||geminiKey);
      if(m!==modelName){modelName=m;ls.set("kondate.model",m);}
      return txt;
    }catch(e){lastErr=e; if(e&&e.status===404) continue; throw e;}
  }
  throw lastErr;
}
function parseArr(txt){
  const m=String(txt||"").replace(/```(?:json)?/g,"").match(/\[[\s\S]*\]/);
  if(!m) return null;
  try{const a=JSON.parse(m[0]);return Array.isArray(a)&&a.every(x=>typeof x==="string")?a:null;}catch(e){return null;}
}
function aiErrText(e){
  if(e&&(e.status===400||e.status===401||e.status===403)) return "APIキーが正しくないようです。Google AI Studioでキーを確認してください。";
  if(e&&e.status===404) return "モデルが見つかりませんでした（404）。時間をおいてもう一度お試しください。";
  if(e&&e.status===429) return "無料枠の回数制限に達しました。少し時間をおいてください。";
  if(e&&e.status) return "Geminiがエラーを返しました（"+e.status+"）。";
  if(e&&e.name==="AbortError") return "Geminiからの返事が20秒以内に来ませんでした。";
  return "Geminiに接続できませんでした。電波を確認してください。";
}

// ================= decomposition =================
function dictLookup(name){
  const n=norm(name);
  if(DICT[n]) return DICT[n];
  const keys=Object.keys(DICT).sort((a,b)=>b.length-a.length);
  for(const k of keys){ if(n.includes(k)) return DICT[k]; }
  for(const k of keys){ if(k.includes(n)&&n.length>=2) return DICT[k]; }
  return null;
}
async function decompose(name){
  const key=norm(name);
  if(S.cache[key]) return {ings:S.cache[key],src:"cache"};
  const fromHist=S.history.find(h=>norm(h.name)===key&&Array.isArray(h.ings)&&h.ings.length);
  if(fromHist) return {ings:fromHist.ings,src:"history"};
  if(aiReady()){
    try{
      const arr=parseArr(await callGemini(PROMPT+name));
      if(arr&&arr.length){
        const ings=[...new Set(arr.map(s=>s.trim()).filter(Boolean))].slice(0,12);
        S.cache[key]=ings;
        store.set("cache",hid(key),{name:key,ings,at:Date.now()}).catch(()=>{});
        return {ings,src:"ai"};
      }
      aiFails++;
    }catch(e){aiFails++;console.warn("Gemini:",e);}
  }
  const d=dictLookup(name);
  if(d) return {ings:d,src:"dict"};
  return {ings:GENERIC,src:"generic"};
}
async function addDishesToShop(dishes){
  const merged={}; const generic=[];
  for(const d of dishes){
    const r=d.ings&&d.ings.length?{ings:d.ings,src:"given"}:await decompose(d.name);
    if(r.src==="generic") generic.push(d.name);
    for(const ing of r.ings){
      const id=hid(ing);
      const cur=merged[id]||S.shop.find(x=>x.id===id)||{name:ing,tags:[],checked:false};
      merged[id]={name:cur.name,tags:[...new Set([...(cur.tags||[]),d.name])],checked:false};
    }
  }
  for(const [id,v] of Object.entries(merged)){ await store.set("shop",id,v).catch(()=>{}); }
  return generic;
}

function parseConfig(text){
  const get=k=>{const m=String(text).match(new RegExp("[\"']?"+k+"[\"']?\\s*:\\s*[\"']([^\"']+)[\"']"));return m?m[1].trim():"";};
  const c={apiKey:get("apiKey"),authDomain:get("authDomain"),projectId:get("projectId"),storageBucket:get("storageBucket"),messagingSenderId:get("messagingSenderId"),appId:get("appId")};
  if(!c.apiKey||!c.projectId) return null;
  if(!c.authDomain) c.authDomain=c.projectId+".firebaseapp.com";
  for(const k of Object.keys(c)) if(!c[k]) delete c[k];
  return c;
}
function bindSetup(){
  $("#copyRules").addEventListener("click",()=>copyText(FIRESTORE_RULES,"ルールをコピーしました"));
  $("#tryLocal").addEventListener("click",()=>{mode="local";ls.set("kondate.mode","local");fbCfg=fbCfg;afterConnect();});
  const back=$("#backApp"); if(back) back.addEventListener("click",()=>afterConnect());
  $("#connectBtn").addEventListener("click",async()=>{
    const msg=$("#setupMsg"); const cfg=parseConfig($("#cfgIn").value);
    msg.className="msgline";
    if(!cfg){msg.className="msgline err";msg.textContent="設定を読み取れませんでした。手順4の { から } までをそのまま貼ってください。";return;}
    const btn=$("#connectBtn"); btn.disabled=true; btn.innerHTML='<span class="spin"></span>つないでいます…'; msg.textContent="";
    const room=(fbCfg&&fbCfg.c&&fbCfg.c.projectId===cfg.projectId&&fbCfg.r)||randRoom();
    try{
      await connectFirebase(cfg,room);
      fbCfg={c:cfg,r:room}; ls.set("kondate.fb",fbCfg); mode="firebase"; ls.set("kondate.mode","firebase");
      resetData(); afterConnect();
    }catch(e){
      btn.disabled=false; btn.textContent="つないで始める";
      msg.className="msgline err"; msg.textContent=friendly(e);
    }
  });
  $("#joinBtn").addEventListener("click",()=>{
    const msg=$("#joinMsg"); const j=readInvite($("#inviteIn").value);
    if(!j){msg.className="msgline err";msg.textContent="リンクを読み取れませんでした。最後まで貼り付けてください。";return;}
    fbCfg=j; ls.set("kondate.fb",j); mode="firebase"; ls.set("kondate.mode","firebase"); boot();
  });
}
function readInvite(text){
  const m=String(text).match(/j=([A-Za-z0-9_-]{20,})/); if(!m) return null;
  try{const j=JSON.parse(b64d(m[1]));if(j&&j.c&&j.c.apiKey&&j.c.projectId&&typeof j.r==="string"&&j.r.length>=16)return {c:j.c,r:j.r};}catch(e){}
  return null;
}
function inviteLink(){
  if(!fbCfg) return "";
  return location.origin+location.pathname+"#j="+b64e(JSON.stringify({c:fbCfg.c,r:fbCfg.r}));
}

const DOW=["月","火","水","木","金","土","日"];
let fillDict=ls.get("kondate.fill",true), animDays=new Set();
function pool(){
  const names=[...new Set(S.history.map(h=>h.name))];
  if(fillDict&&names.length<7){for(const k of Object.keys(DICT)) if(k!=="唐揚げ"&&k!=="うどん"&&!names.some(n=>norm(n)===k)) names.push(k);}
  return names;
}
function pick(exclude){const p=pool().filter(n=>!exclude.includes(n));if(!p.length)return null;return p[Math.floor(Math.random()*p.length)];}
function weekDays(){return (S.week&&Array.isArray(S.week.days)&&S.week.days.length===7)?S.week.days.map(d=>({...d})):null;}
async function saveWeek(days){S.week={days};render();await store.set("week","current",{days,at:Date.now()}).catch(()=>{});}
function shuffleAll(){
  const cur=weekDays()||DOW.map(()=>({name:null,locked:false,on:true}));
  const used=cur.filter(d=>d.locked&&d.name).map(d=>d.name);
  const days=cur.map(d=>{if(d.locked&&d.name)return d;const n=pick(used);if(n)used.push(n);return {name:n,locked:false,on:d.on!==false};});
  animDays=new Set(days.map((d,i)=>d.locked?-1:i));saveWeek(days);
}

  const days=weekDays(); const n=new Set(S.history.map(h=>h.name)).size;

    const on=d.on!==false;
    return '<div class="day '+(on?"on":"off")+' '+(animDays.has(i)?"shake":"")+'"><button class="ck" data-on="'+i+'" type="button" aria-label="'+DOW[i]+'曜日を買い物に'+(on?"含めない":"含める")+'"><span class="box">'+CHECK+'</span></button><span class="dw '+(i===5?"sat":i===6?"sun":"")+'">'+DOW[i]+'</span><span class="name">'+(d.name?esc(d.name):'<span style="color:var(--muted)">（空き）</span>')+(d.name&&!fromHist.has(d.name)?'<small>おすすめ料理から</small>':'')+'</span><button class="mini '+(d.locked?"locked":"")+'" data-lock="'+i+'" type="button" aria-label="'+DOW[i]+'曜日を'+(d.locked?"固定解除":"固定")+'" aria-pressed="'+!!d.locked+'"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="'+(d.locked?"M7 11V7a5 5 0 0 1 10 0v4":"M7 11V7a5 5 0 0 1 9.9-1")+'"/></svg></button><button class="mini" data-re="'+i+'" type="button" aria-label="'+DOW[i]+'曜日だけ引き直す" '+(d.locked?"disabled":"")+'><svg class="i" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg></button></div>';
  }).join("")+'</div>';

  h+='<div class="actions"><button class="btn ghost block" id="shuf" type="button"><svg class="i" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>全体をシャッフル</button>'+
     '<button class="btn block" id="wkShop" type="button" '+(cnt&&!busy?"":"disabled")+'>'+(busy?'<span class="spin"></span>食材を考えています…':'選んだ'+cnt+'日分の食材を買い物リストへ →')+'</button>'+
     '<button class="btn sage block" id="wkChat" type="button" '+(cnt?"":"disabled")+'>今週の献立としてチャットに共有</button></div>';

function bindWeek(){
  setTimeout(()=>{animDays=new Set();},500);
  $("#fillT").addEventListener("click",()=>{fillDict=!fillDict;ls.set("kondate.fill",fillDict);render();});
  const fs=$("#firstShuffle"); if(fs) fs.addEventListener("click",shuffleAll);
  const sh=$("#shuf"); if(sh) sh.addEventListener("click",shuffleAll);
  document.querySelectorAll("[data-on]").forEach(b=>b.addEventListener("click",()=>{const d=weekDays();const i=+b.dataset.on;d[i].on=d[i].on===false;saveWeek(d);}));
  document.querySelectorAll("[data-lock]").forEach(b=>b.addEventListener("click",()=>{const d=weekDays();const i=+b.dataset.lock;d[i].locked=!d[i].locked;saveWeek(d);}));
  document.querySelectorAll("[data-re]").forEach(b=>b.addEventListener("click",()=>{const d=weekDays();const i=+b.dataset.re;const n=pick(d.map(x=>x.name).filter(Boolean));if(n){d[i].name=n;animDays=new Set([i]);saveWeek(d);}else toast("ほかに候補がありません");}));
  const ws=$("#wkShop"); if(ws) ws.addEventListener("click",async()=>{
    const d=weekDays().filter(x=>x.on!==false&&x.name);
    busy=true;render();aiFails=0;
    const dishes=d.map(x=>{const h=[...S.history].filter(y=>y.name===x.name).sort((a,b)=>b.at-a.at)[0];return {name:x.name,ings:h?h.ings:null};});
    await addDishesToShop(dishes);busy=false;setTab("shop");toast(d.length+"日分の食材をまとめました");
  });
  const wc=$("#wkChat"); if(wc) wc.addEventListener("click",async()=>{
    const d=weekDays();const text="📅 今週の献立\n"+d.map((x,i)=>x.on!==false&&x.name?DOW[i]+"　"+x.name:null).filter(Boolean).join("\n");
    await store.set("menus",uid(),{type:"note",text,by:myName,at:Date.now()}).catch(()=>{});
    setTab("chat");
  });
}

// ================= settings modal =================
function openSettings(){
  const ov=document.createElement("div");ov.className="modalwrap";
  let confirmLeave=false;
  const draw=()=>{
    const link=inviteLink();
    ov.innerHTML='<div class="modal" role="dialog" aria-label="設定"><h3>設定</h3>'+
    '<div class="set"><b>お名前</b><div class="row"><input type="text" id="nameChg" maxlength="12" value="'+esc(myName)+'" autocomplete="off"><button class="btn ghost" id="nameSave" type="button">変更</button></div></div>'+
    (mode==="firebase"
      ?'<div class="set"><b>奥様に送る招待リンク</b><span class="muted">このリンクを開くだけで、同じ献立帖につながります。ふたり以外には送らないでください。</span><input type="text" id="invLink" readonly value="'+esc(link)+'"><div class="row"><button class="btn" id="invCopy" type="button" style="flex:1">コピー</button>'+(navigator.share?'<button class="btn sage" id="invShare" type="button" style="flex:1">LINEなどで送る</button>':'')+'</div><span class="muted">奥様のiPhoneでは、リンクをSafariで開いたあと、共有ボタンから「ホーム画面に追加」をするとアプリのように使えます。</span></div>'
      :'<div class="set"><b>共有のようす</b><span class="muted">いまはこの端末の中だけに保存しています。奥様と共有するには準備が必要です。</span><button class="btn block" id="goSetup" type="button">共有の設定をはじめる</button></div>')+
    '<div class="set"><b>Gemini APIキー</b><span class="muted">Google AI Studioで無料で取れるキーです。入れると、辞書にない料理もAIが食材に分けます。キーはこの端末の中だけに保存されます。</span>'+
      '<div><span class="chip '+(geminiKey?'':'terra')+'">'+(geminiKey?'AI分解モード（キー保存済み）':'辞書モード（キー未設定）')+'</span></div>'+
      '<input type="password" id="keyIn" placeholder="AIza… で始まるキーを貼り付け" autocomplete="off" value="'+esc(geminiKey)+'">'+
      '<div class="row"><button class="btn" id="keySave" type="button" style="flex:1">保存</button><button class="btn ghost" id="keyTest" type="button" style="flex:1">接続テスト</button></div>'+
      (geminiKey?'<button class="btn ghost block" id="keyDel" type="button">キーを消して辞書モードに戻す</button>':'')+
      '<div id="keyMsg" class="msgline" role="status"></div><span class="muted" style="font-size:.78rem">使用モデル：'+esc(modelName)+'</span></div>'+
    (mode==="firebase"
      ?'<div class="set"><b>この端末の接続</b>'+(confirmLeave?'<span class="muted">この端末の設定を消します。献立のデータは消えません。もう一度つなぐには招待リンクが必要です。</span><div class="row"><button class="btn ghost" id="leaveNo" type="button" style="flex:1">やめる</button><button class="btn" id="leaveYes" type="button" style="flex:1">解除する</button></div>':'<button class="btn ghost block" id="leave" type="button">接続を解除する</button>')+'</div>':'')+
    '<div class="set"><b>辞書に入っている料理（'+Object.keys(DICT).length+'品）</b><span class="muted">'+esc(Object.keys(DICT).join("・"))+'</span></div>'+
    '<button class="btn block" id="closeM" type="button">とじる</button></div>';
    const q=s=>ov.querySelector(s), msg=t=>{const m=q("#keyMsg");if(m)m.textContent=t;};
    q("#closeM").onclick=()=>ov.remove();
    q("#nameSave").onclick=()=>{const v=q("#nameChg").value.trim();if(!v){toast("お名前を入れてください");return;}myName=v;ls.set("kondate.name",v);render();toast("名前を変えました");};
    if(q("#invCopy")){q("#invCopy").onclick=()=>copyText(link,"リンクをコピーしました");q("#invLink").onfocus=e=>e.target.select();}
    if(q("#invShare")) q("#invShare").onclick=()=>{navigator.share({title:"ふたりの献立帖",text:"献立アプリです。開いたら名前を入れてね。",url:link}).catch(()=>{});};
    if(q("#goSetup")) q("#goSetup").onclick=()=>{ov.remove();screen="setup";render();};
    q("#keySave").onclick=()=>{const v=q("#keyIn").value.trim();geminiKey=v;ls.set("kondate.geminiKey",v);draw();render();const m=q("#keyMsg");if(m){m.className="msgline ok";m.textContent=v?"保存しました。「接続テスト」で動くか確かめられます。":"キーが空なので辞書モードです。";}};
    q("#keyTest").onclick=async()=>{
      const v=q("#keyIn").value.trim();
      if(!v){msg("先にキーを入れてください。");return;}
      q("#keyMsg").className="msgline"; msg("Geminiに問い合わせています…");
      try{const arr=parseArr(await callGemini(PROMPT+"カレー",v));const m=q("#keyMsg");if(arr&&arr.length){m.className="msgline ok";m.textContent="つながりました（"+modelName+"）。カレー → "+arr.join("、");}else{m.className="msgline err";m.textContent="つながりましたが、答えの形が想定と違いました。";}}
      catch(e){const m=q("#keyMsg");m.className="msgline err";m.textContent=aiErrText(e);}
    };
    if(q("#keyDel")) q("#keyDel").onclick=()=>{geminiKey="";ls.set("kondate.geminiKey","");draw();render();};
    if(q("#leave")) q("#leave").onclick=()=>{confirmLeave=true;draw();};
    if(q("#leaveNo")) q("#leaveNo").onclick=()=>{confirmLeave=false;draw();};
    if(q("#leaveYes")) q("#leaveYes").onclick=()=>{ls.del("kondate.fb");ls.del("kondate.mode");try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}location.reload();};
  };
  draw(); ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();}); document.body.appendChild(ov);
}
$("#gear").addEventListener("click",openSettings);
$("#syncBadge").addEventListener("click",()=>{if(screen==="app")openSettings();});

// ================= boot =================
function resetData(){S.menus=[];S.shop=[];S.history=[];S.cache={};S.week=null;seedTried=false;}
async function seedIfNeeded(){
  try{
    if(await store.get("meta","seeded")) return;
    if(S.history.length){await store.set("meta","seeded",{at:Date.now()});return;}
    const now=Date.now();
    for(let i=0;i<SEEDS.length;i++){
      await store.set("history","s"+String(i+1).padStart(2,"0"),{name:SEEDS[i][0],ings:SEEDS[i][1],at:now-(i+1)*2*86400000,sample:true});
    }
    await store.set("meta","seeded",{at:now});
  }catch(e){console.warn("seed",e);}
}
function subscribeAll(){
  store.listen("menus",rows=>{S.menus=rows;const grew=rows.length>lastMenuCount;lastMenuCount=rows.length;render();if(tab==="chat"&&grew&&screen==="app")scrollChatEnd();});
  store.listen("shop",rows=>{S.shop=rows;render();});
  store.listen("history",(rows,fromCache)=>{S.history=rows;render();if(!fromCache&&!seedTried){seedTried=true;seedIfNeeded();}});
  store.listen("cache",rows=>{for(const r of rows) if(r.name&&Array.isArray(r.ings)) S.cache[r.name]=r.ings;});
  store.listen("week",rows=>{const w=rows.find(r=>r.id==="current");S.week=w||null;render();});
}
function startApp(){
  screen="app";
  if(!started){started=true;subscribeAll();}
  render(); if(tab==="chat") scrollChatEnd();
}
function afterConnect(){
  if(!myName){screen="name";render();return;}
  startApp();
}
function applyHash(){
  const j=readInvite(location.hash||"");
  if(!j) return;
  if(!(fbCfg&&fbCfg.r===j.r&&fbCfg.c&&fbCfg.c.projectId===j.c.projectId)){
    fbCfg=j; ls.set("kondate.fb",j);
  }
  mode="firebase"; ls.set("kondate.mode","firebase");
}
async function boot(){
  applyHash();
  if(mode==="firebase"&&fbCfg){
    screen="loading"; render();
    try{ if(!fb) await connectFirebase(fbCfg.c,fbCfg.r); }
    catch(e){screen="error";errMsg=friendly(e);render();return;}
  }else if(mode==="local"){
    // local mode: nothing to connect
  }else{
    screen="setup"; render(); return;
  }
  afterConnect();
}
boot();
</script>
